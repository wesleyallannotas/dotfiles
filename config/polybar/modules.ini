; Layout dos módulos da barra. Este arquivo é incluído dentro de [bar/main]
; pelo config.ini do tema ativo, então é o único lugar para escolher módulos.
; Cada tema traz o seu layout de exemplo comentado no próprio config.ini.

; Layout antigo (dracula):
; modules-left = date margin title
; modules-center = trap-left bspwm trap-right
; modules-right = memory margin cpu margin cpuTemp margin alsa

; Layout atual (onedark)
modules-left = bspwm margin date margin weather
modules-center =

modules-right = cpu margin temperature margin memory margin pulseaudio margin backlight margin battery margin wallz margin session margin tray

; Só pode existir um tray na sessão: ele fica só em bar/main (monitor primário).
; bar/secondary (demais monitores) usa a lista abaixo, que é a mesma de cima
; sem o tray, via ${bar/main.modules-right-notray}. Ao mudar a lista de cima,
; mude esta também. (O polybar só resolve ${...} quando é o valor inteiro, por
; isso não dá para montar uma lista a partir da outra.)
modules-right-notray = cpu margin temperature margin memory margin pulseaudio margin backlight margin battery margin wallz margin session
