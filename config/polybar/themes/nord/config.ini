include-file = $HOME/.config/polybar/themes/nord/include-modules.ini

[bar/main]
width = 100%
height = 30
line-size = 2
offset-y = 0
bottom = true
fixed-center = true

wm-restack = bspwm
; wm-restack = i3

override-redirect = false

scroll-up = next
scroll-down = prev

enable-ipc = true

background = ${colors.bg}
foreground = ${colors.fg}

include-file = $HOME/.config/polybar/fonts.ini
include-file = $HOME/.config/polybar/modules.ini
; Layout deste tema (copie para o modules.ini ao trocar de tema):
; modules-left = date margin weather margin mpd round-right
; modules-center = trap-left bspwm trap-right
; modules-right = xkeyboard margin memory margin cpu margin xbacklight margin pulseaudio margin wallz margin session

tray-background = ${colors.bg}
tray-position = right
tray-maxsize = 16

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
