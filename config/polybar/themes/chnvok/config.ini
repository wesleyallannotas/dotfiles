include-file = $HOME/.config/polybar/themes/chnvok/include-modules.ini

[bar/main]
width = 100%
height = 30
offset-y = 0
bottom = true
fixed-center = true

wm-restack = bspwm
; wm-restack = i3

override-redirect = false

scroll-up = next
scroll-down = prev

enable-ipc = true

background = ${colors.bg}
foreground = ${colors.fg}

include-file = $HOME/.config/polybar/fonts.ini
include-file = $HOME/.config/polybar/modules.ini
; Layout deste tema (copie para o modules.ini ao trocar de tema):
; modules-left = date weather mpd
; modules-center = bspwm
; modules-right = memory cpu xbacklight pulseaudio session

tray-background = ${colors.bg}
tray-position = right
tray-maxsize = 15

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
