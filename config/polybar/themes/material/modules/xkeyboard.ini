[module/xkeyboard]
type = internal/xkeyboard
; Só o layout interessa: ignora os indicadores de lock.
blacklist-0 = num lock
blacklist-1 = caps lock
blacklist-2 = scroll lock

format = <label-layout>
format-prefix = %{T5}%{T-}
format-prefix-background = ${colors.purple}
format-prefix-foreground = ${colors.bg}
format-prefix-padding = 1
label-layout = %{T1}%layout%%{T-}
label-layout-background = ${colors.bg}
label-layout-foreground = ${colors.fg}
label-layout-padding = 1
