[module/temperature]
type = internal/temperature
interval = 2
; Temperatura do pacote da CPU (Intel). zone-type é estável entre boots,
; ao contrário de thermal-zone/hwmon-path (numeração muda).
zone-type = x86_pkg_temp
base-temperature = 30
warn-temperature = 80

format = <label>
format-prefix = %{T10}%{T-}
format-prefix-background = ${colors.yellow}
format-prefix-foreground = ${colors.bg}
format-prefix-padding = 1

format-warn = <label-warn>
format-warn-prefix = %{T10}%{T-}
format-warn-prefix-background = ${colors.red}
format-warn-prefix-foreground = ${colors.bg}
format-warn-prefix-padding = 1

label = %{T2}%temperature-c%%{T-}
label-background = ${colors.yellow-alt}
label-foreground = ${colors.yellow}
label-padding = 1

label-warn = %{T2}%temperature-c%%{T-}
label-warn-background = ${colors.red-alt}
label-warn-foreground = ${colors.red}
label-warn-padding = 1
