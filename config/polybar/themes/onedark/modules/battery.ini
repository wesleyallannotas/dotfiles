[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 15
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = %{T10}%{T-}
format-charging-prefix-background = ${colors.green}
format-charging-prefix-foreground = ${colors.bg}
format-charging-prefix-padding = 1
label-charging = %{T2}%percentage%%{T-}%{T10}%{T-}
label-charging-background = ${colors.green-alt}
label-charging-foreground = ${colors.green}
label-charging-padding = 1

format-discharging = <ramp-capacity><label-discharging>
ramp-capacity-0 = %{T10}%{T-}
ramp-capacity-1 = %{T10}%{T-}
ramp-capacity-background = ${colors.cyan}
ramp-capacity-foreground = ${colors.bg}
ramp-capacity-padding = 1
label-discharging = %{T2}%percentage%%{T-}%{T10}%{T-}
label-discharging-background = ${colors.cyan-alt}
label-discharging-foreground = ${colors.cyan}
label-discharging-padding = 1

format-low = <label-low>
format-low-prefix = %{T10}%{T-}
format-low-prefix-background = ${colors.red}
format-low-prefix-foreground = ${colors.bg}
format-low-prefix-padding = 1
label-low = %{T2}%percentage%%{T-}%{T10}%{T-}
label-low-background = ${colors.red-alt}
label-low-foreground = ${colors.red}
label-low-padding = 1

format-full = <label-full>
format-full-prefix = %{T10}%{T-}
format-full-prefix-background = ${colors.cyan}
format-full-prefix-foreground = ${colors.bg}
format-full-prefix-padding = 1
label-full = %{T2}%percentage%%{T-}%{T10}%{T-}
label-full-background = ${colors.cyan-alt}
label-full-foreground = ${colors.cyan}
label-full-padding = 1
