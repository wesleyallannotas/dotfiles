include-file = $HOME/.config/polybar/themes/onedark/include-modules.ini

; Layout antigo deste tema, agora centralizado em $HOME/.config/polybar/modules.ini.
; Só pode existir um tray na sessão, então ele fica apenas na barra do
; monitor primário (bar/main); os outros monitores usam bar/secondary.
; [layout]
; left = bspwm margin date margin weather
; center =
; right = cpu margin temperature margin memory margin pulseaudio margin backlight margin battery margin wallz margin session
; right-tray = cpu margin temperature margin memory margin pulseaudio margin backlight margin battery margin wallz margin session margin tray

; Uma instância por monitor: o launch.sh exporta MONITOR antes de iniciar.
[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
line-size = 2
offset-y = 0
bottom = false
fixed-center = true

wm-restack = bspwm
; wm-restack = i3

override-redirect = false

scroll-up = next
scroll-down = prev

enable-ipc = true

background = ${colors.bg}
foreground = ${colors.fg}

include-file = $HOME/.config/polybar/fonts.ini
include-file = $HOME/.config/polybar/modules.ini
; Layout deste tema (copie para o modules.ini ao trocar de tema):
; modules-left = bspwm margin date margin weather
; modules-center =
; modules-right = xkeyboard margin cpu margin temperature margin memory margin pulseaudio margin backlight margin battery margin wallz margin session margin tray
; modules-right-notray = xkeyboard margin cpu margin temperature margin memory margin pulseaudio margin backlight margin battery margin wallz margin session

; Antes o layout ficava na seção [layout] acima:
; modules-left = ${layout.left}
; modules-center = ${layout.center}
; modules-right = ${layout.right-tray}

cursor-click = pointer
cursor-scroll = ns-resize

[bar/secondary]
inherit = bar/main
; Lista sem o tray definida no modules.ini (só bar/main pode ter tray).
modules-center-notray = ${bar/main.modules-center-notray}
; modules-right = ${layout.right}

[settings]
screenchange-reload = true
